name: VOICEMORPH independent artifact QA
on:
  workflow_dispatch:
    inputs:
      voice_run:
        description: Successful Windows build run ID for the current develop/v1.0.0 HEAD
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  full-qa:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.0.0
      - name: Download exact current-HEAD shipping artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_RUN: ${{ inputs.voice_run }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:VOICE_RUN -notmatch '^[0-9]+$') { throw "Invalid build run ID" }
          $runText = gh api "repos/challanger2000/125A-VOICEMORPH/actions/runs/$env:VOICE_RUN"
          if ($LASTEXITCODE -ne 0) { throw "Cannot verify build provenance" }
          $run = ($runText -join "`n") | ConvertFrom-Json
          $head = (git rev-parse HEAD).Trim()
          if ($run.head_sha -ne $head -or $run.conclusion -ne "success") {
            throw "Build is not a completed successful run for current HEAD"
          }
          gh run download $env:VOICE_RUN --repo challanger2000/125A-VOICEMORPH `
            --name VoiceMorph-v0.1.0-Windows-x64-DEVELOPMENT --dir plugin
          if ($LASTEXITCODE -ne 0) { throw "Current plugin artifact download failed" }
          python tools/check-vst3-package.py "plugin/125A VoiceMorph.vst3"
          if ($LASTEXITCODE -ne 0) { throw "Actual artifact package invalid" }
      - name: Run independent full 125A Tester on downloaded artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/run-full-qa.ps1 -PluginPath "plugin/125A VoiceMorph.vst3"
      - name: Archive full QA and exact binary provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMorph-125A-Full-QA-Reports
          path: build/full-qa-reports/
          if-no-files-found: warn
          retention-days: 30
