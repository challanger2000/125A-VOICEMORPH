name: VST3 Windows Build
on:
  workflow_dispatch:
  push:
    branches: [develop/v1.0.0]
    paths: [vst/**, src/**, tests/**, CMakeLists.txt, .github/workflows/vst3-build.yml]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official VST3 SDK
        shell: pwsh
        run: |
          git clone --branch v3.8.1_build_84 --depth 1 --recursive https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          $actual=(git -C external/vst3sdk rev-parse HEAD).Trim()
          if ($actual -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') { throw "Unexpected VST3 SDK SHA: $actual" }
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_VST3=ON -DVST3_SDK_ROOT="${{ github.workspace }}/external/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=OFF
      - name: Compile
        run: cmake --build build --config Release --target VoiceMorph test_voice test_ir test_wav test_ir_matrix test_partitioned_ir test_fft_stereo test_ir_resampler test_ir_stage test_meter_units test_ir_pipeline test_ir_file test_ir_builder test_ir_builder_stereo test_ir_handoff test_fixed_latency_ir test_ir_load_info test_pitch_formant test_pitch_chain test_pitch_realtime test_state_mailbox test_parameter_text test_parameter_cursor test_sample_format test_bus_layout test_ir_state_blob test_target_rates test_hollywood_preset test_b1_correction --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Spectral realtime CPU and allocation probe
        run: .\build\Release\test_pitch_realtime.exe
      - name: Stage installable VST3 directory
        shell: pwsh
        run: |
          $source = "build/VST3/Release/VoiceMorph.vst3"
          if (-not (Test-Path -LiteralPath $source)) { throw "VST3 bundle missing: $source" }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item -LiteralPath $source -Destination "dist/VoiceMorph.vst3" -Recurse -Force
          if (-not (Test-Path -LiteralPath "dist/VoiceMorph.vst3/Contents/x86_64-win/VoiceMorph.vst3")) {
            throw "Installable VST3 binary missing from dist/VoiceMorph.vst3"
          }
      - name: Package VST3 development build
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMorph-v0.1.0-Windows-x64-DEVELOPMENT
          path: dist/
          if-no-files-found: error
          retention-days: 14
