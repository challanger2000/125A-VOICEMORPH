name: VST3 Windows Build
on:
  workflow_dispatch:
  push:
    branches: [develop/v1.0.0]
    paths: [vst/**, src/**, tests/**, tools/**, CMakeLists.txt, .github/workflows/vst3-build.yml]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official VST3 SDK
        shell: pwsh
        run: |
          git clone --branch v3.8.1_build_84 --depth 1 --recursive https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          $actual=(git -C external/vst3sdk rev-parse HEAD).Trim()
          if ($actual -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') { throw "Unexpected VST3 SDK SHA: $actual" }
      - name: Render approved 125A master logo
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock @resvg/resvg-js@2.6.2
          if ($LASTEXITCODE -ne 0) { throw "Master SVG renderer install failed" }
          node tools/render-logo.cjs
          if ($LASTEXITCODE -ne 0) { throw "125A master logo generation failed" }
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_VST3=ON -DVST3_SDK_ROOT="${{ github.workspace }}/external/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=OFF
      - name: Compile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cmake --build build --config Release --target VoiceMorph test_voice test_ir test_wav test_ir_matrix test_partitioned_ir test_fft_stereo test_ir_resampler test_ir_stage test_meter_units test_ir_pipeline test_ir_file test_ir_builder test_ir_builder_stereo test_ir_handoff test_fixed_latency_ir test_ir_load_info test_pitch_formant test_pitch_chain test_pitch_realtime test_state_mailbox test_parameter_text test_parameter_cursor test_sample_format test_bus_layout test_ir_state_blob test_target_rates test_hollywood_preset test_b1_correction test_reverb_mix test_voice_bypass test_control_wiring test_voice_control_responses test_ir_tail_accounting test_vm_editor_lifecycle test_vm_host test_audit_repairs --parallel 4 2>&1 | Tee-Object -FilePath "build/windows-compile.log"
          $buildExit = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          if ($buildExit -ne 0) {
            "## Windows compiler failure" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content "build/windows-compile.log" |
              Select-String -Pattern "error|fatal|(?<!0 )failed" |
              Select-Object -Last 50 | ForEach-Object {
                $line = $_.Line
                Write-Host ("::error::" + ($line -replace "%", "%25" -replace "`r", "%0D" -replace "`n", "%0A"))
                $line
              } |
              Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $buildExit
          }

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Native packaged VST3 editor lifecycle (20 cycles)
        shell: pwsh
        run: |
          $plugin = "build/VST3/Release/125A VoiceMorph.vst3"
          if (-not (Test-Path -LiteralPath $plugin)) { throw "VST3 missing" }
          & ".\\build\\Release\\test_vm_editor_lifecycle.exe" $plugin
          if ($LASTEXITCODE -ne 0) { throw "Native editor lifecycle probe failed: $LASTEXITCODE" }
      - name: Archive actual native editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMorph-Native-GUI-Screenshots
          path: qa-screenshots/*.bmp
          if-no-files-found: warn
          retention-days: 14
      - name: Spectral realtime CPU and allocation probe
        run: .\build\Release\test_pitch_realtime.exe
      - name: Stage installable VST3 directory
        shell: pwsh
        run: |
          $source = "build/VST3/Release/125A VoiceMorph.vst3"
          if (-not (Test-Path -LiteralPath $source)) { throw "VST3 bundle missing: $source" }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item -LiteralPath $source -Destination "dist/125A VoiceMorph.vst3" -Recurse -Force
      - name: Validate exact staged package and native audio recall
        shell: pwsh
        run: |
          python tools/check-vst3-package.py "dist/125A VoiceMorph.vst3"
          if ($LASTEXITCODE -ne 0) { throw "Shipping package structure mismatch" }
          $validator = Get-ChildItem build -Recurse -File -Filter "validator.exe" | Select-Object -First 1
          if (-not $validator) { throw "Pinned SDK validator missing" }
          & $validator.FullName "dist/125A VoiceMorph.vst3"
          if ($LASTEXITCODE -ne 0) { throw "Staged package validation failed" }
          & ".\build\Release\test_vm_host.exe" "dist/125A VoiceMorph.vst3"
          if ($LASTEXITCODE -ne 0) { throw "Staged module audio/state integration failed" }
      - name: Full independent 125A Tester on this build's shipping package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/run-full-qa.ps1 -PluginPath "dist/125A VoiceMorph.vst3"
      - name: Archive current shipping-package QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMorph-125A-Full-QA-Reports
          path: build/full-qa-reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Write delivery instructions and build provenance
        shell: pwsh
        run: |
          Copy-Item "docs/INSTALL-WINDOWS.md" "dist/INSTALL-WINDOWS.txt"
          $binary = "dist/125A VoiceMorph.vst3/Contents/x86_64-win/125A VoiceMorph.vst3"
          @{
            commit = (git rev-parse HEAD).Trim()
            reference_commit = "341fc8bd1a3d4a42e20ed945420a352ffe10708d"
            version = "0.1.0"
            platform = "Windows x64"
            module_sha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
            actions_run = "${{ github.run_id }}"
            sdk_commit = "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96"
          } | ConvertTo-Json | Set-Content "dist/BUILD-PROVENANCE.json"
      - name: Package VST3 development build
        id: windows_vst3_package
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMorph-v0.1.0-Windows-x64-DEVELOPMENT
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Provide Windows package download
        shell: pwsh
        run: |
          Write-Host "::notice title=Windows VST3 download::${{ steps.windows_vst3_package.outputs.artifact-url }}"
